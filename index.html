<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Brand Pulse | AI Sentiment Monitor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 24px; }
        h1 { color: #38bdf8; margin-top: 0; }
        textarea { width: 100%; height: 90px; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 12px; font-weight: bold; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .POSITIVE { background: #16a34a; color: white; }
        .NEGATIVE { background: #dc2626; color: white; }
        .NEUTRAL { background: #64748b; color: white; }
        .MIXED { background: #d97706; color: white; }
        .review-item { border-bottom: 1px solid #334155; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .alert-banner { background: #7f1d1d; border: 1px solid #ef4444; padding: 12px; border-radius: 8px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📊 Social Brand Pulse</h1>
        <p style="color: #94a3b8;">Real-time Customer Sentiment Analysis & Crisis Alert System (Level 4 Automated)</p>
        <textarea id="reviewInput" placeholder="Enter customer feedback in Thai or English (e.g., 'บริการดีมาก ประทับใจ' or 'Terrible service, broken item!')..."></textarea>
        <button id="analyzeBtn" onclick="analyzeText()">Analyze Sentiment</button>
        <div id="alertBox" class="alert-banner">🚨 <b>Crisis Alert Triggered!</b> Negative sentiment detected. An urgent email notification has been sent via Amazon SNS and logged to S3.</div>
    </div>

    <div class="card">
        <h3>Recent Mentions History (Live from DynamoDB)</h3>
        <div id="historyList">Loading history...</div>
    </div>

    <script>
        // บรรทัดที่ 40: นำ Invoke URL จาก API Gateway มาวางแทนที่ YOUR_API_URL ห้ามลืมใส่ /analyze ต่อท้าย URL ด้วย
        const API_URL = "YOUR_API_URL/analyze";

        async function loadHistory() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const list = document.getElementById('historyList');
                if (!data.length) {
                    list.innerHTML = "<p style='color:#64748b'>No reviews analyzed yet.</p>";
                    return;
                }
                list.innerHTML = data.map(item => `
                    <div class="review-item">
                        <div>
                            <div style="font-size: 15px; margin-bottom: 4px;">"${item.text}"</div>
                            <div style="font-size: 12px; color: #94a3b8;">ID: ${item.review_id} • Confidence: ${item.confidence}% • ${new Date(item.timestamp).toLocaleString()}</div>
                        </div>
                        <span class="badge ${item.sentiment}">${item.sentiment}</span>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('historyList').innerHTML = "<p style='color:#ef4444'>Failed to load data. Check API_URL.</p>";
            }
        }

        async function analyzeText() {
            const text = document.getElementById('reviewInput').value.trim();
            if (!text) return alert("Please enter some text first!");
            
            const btn = document.getElementById('analyzeBtn');
            const alertBox = document.getElementById('alertBox');
            btn.disabled = true;
            btn.innerText = "Analyzing...";
            alertBox.style.display = "none";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const result = await res.json();
                
                if (result.alert_sent) {
                    alertBox.style.display = "block";
                }
                document.getElementById('reviewInput').value = "";
                await loadHistory();
            } catch (err) {
                alert("Error analyzing text: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze Sentiment";
            }
        }

        loadHistory();
    </script>
</body>
</html>
